name: Build, Sign and Release APK
on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ==============================
      # Checkout
      # ==============================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==============================
      # Java
      # ==============================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==============================
      # Gradle permission
      # ==============================
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ==============================
      # Generate short commit SHA for APK and release naming
      # ==============================
      - name: Generate short commit SHA
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

          echo "Short SHA: $SHORT_SHA"

      # ==============================
      # Restore embedded signing key
      # ==============================
      - name: Restore signing key
        shell: bash
        run: |
          cat <<'EOF' | base64 --decode > key.jks
          
          EOF

          chmod 600 key.jks

          if [ ! -s key.jks ]; then
            echo "ERROR: Failed to restore keystore!"
            exit 1
          fi

      # ==============================
      # Build unsigned APK
      # ==============================
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # ==============================
      # Find APK
      # ==============================
      - name: Find Release APK
        id: apk
        shell: bash
        run: |
          echo "=== Generated APK files ==="
          find . -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            ! -name "*unaligned*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          echo "Using APK: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ==============================
      # Find Android Build Tools
      # ==============================
      - name: Find Android Build Tools
        id: tools
        shell: bash
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found!"
            exit 1
          fi

          echo "version=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
          echo "Using: $APKSIGNER"

      # ==============================
      # Sign APK
      # ==============================
      - name: Sign APK
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/${{ steps.tools.outputs.version }}/apksigner"

          "$APKSIGNER" sign \
            --ks key.jks \
            --ks-key-alias SDC \
            --ks-pass pass:password \
            --key-pass pass:password \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app-signed.apk \
            "${{ steps.apk.outputs.apk }}"

      # ==============================
      # Verify signature
      # ==============================
      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/${{ steps.tools.outputs.version }}/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            app-signed.apk

          echo "APK signature verified successfully"

      # ==============================
      # Rename APK
      # ==============================
      - name: Rename signed APK
        shell: bash
        run: |
          APK_NAME="app-${SHORT_SHA}.apk"

          mv app-signed.apk "$APK_NAME"

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

          echo "Final APK: $APK_NAME"

      # ==============================
      # Create GitHub Release
      # ==============================
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SHORT_SHA }}
          name: Release ${{ env.SHORT_SHA }}
          generate_release_notes: true
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Also upload as workflow artifact
      # ==============================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.SHORT_SHA }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      # ==============================
      # Remove private key
      # ==============================
      - name: Remove signing key
        if: always()
        run: rm -f key.jks
